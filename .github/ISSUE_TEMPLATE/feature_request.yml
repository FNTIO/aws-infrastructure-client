name: Feature request
description: Propose a new capability or a change to an existing one
labels: ["type: feature", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Not sure it fits, or want to talk it through first? Start an [Ideas discussion](https://github.com/FNTIO/aws-infrastructure-client/discussions/new?category=ideas) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web app
        - Desktop app
        - API
        - CDK stacks
        - Private network (VPN)
        - Auth / sign-in
        - Release / CI
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Who is this for
      multiple: true
      options:
        - Portal users (people vending credentials)
        - Admins (people managing users, groups, access)
        - Operators (people running their own deployment)
        - Contributors (people working on this repo)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, slow, or impossible today, and how often it comes up.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What it would look like. For config-driven features, sketch the config block.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including "do nothing", and why they fall short.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the roadmap for this idea
