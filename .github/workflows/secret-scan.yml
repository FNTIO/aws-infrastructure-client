# Nothing deployment-specific may enter this repo: gitleaks for credentials, check-public.mjs for
# account ids, pool ids, hostnames. Runs on every push and pull request.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-public.mjs
