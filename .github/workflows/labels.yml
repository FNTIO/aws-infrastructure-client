# Creates or updates the repo's labels from .github/labels.json. Never deletes:
# a label missing from the file is reported, not removed, so nothing already
# applied to issues disappears.
name: Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

# Naming any scope sets the rest to none, so checkout needs contents spelled out.
permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wanted = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
            const byName = new Map(existing.map((l) => [l.name.toLowerCase(), l]));
            for (const l of wanted) {
              const cur = byName.get(l.name.toLowerCase());
              if (!cur) {
                await github.rest.issues.createLabel({ owner, repo, name: l.name, color: l.color, description: l.description });
                core.info(`created  ${l.name}`);
              } else if (cur.name !== l.name || cur.color !== l.color || (cur.description ?? '') !== l.description) {
                await github.rest.issues.updateLabel({ owner, repo, name: cur.name, new_name: l.name, color: l.color, description: l.description });
                core.info(`updated  ${l.name}`);
              }
            }
            const unmanaged = existing
              .filter((l) => !wanted.some((w) => w.name.toLowerCase() === l.name.toLowerCase()))
              .map((l) => l.name);
            if (unmanaged.length) core.notice(`Labels not in labels.json, left untouched: ${unmanaged.join(', ')}`);
